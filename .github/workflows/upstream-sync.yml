name: Upstream Sync

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/adkit-dev/adkit-docs.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Set up dev sync branch
        run: |
          # Create or reset the upstream-sync branch from upstream/main
          git checkout -B upstream-sync upstream/main

      - name: Push dev sync branch
        run: git push origin upstream-sync --force

      - name: Merge sync branch into main
        run: |
          git checkout main
          git merge upstream-sync --no-edit -m "chore: sync upstream changes from adkit-dev/adkit-docs"

      - name: Push main
        run: git push origin main
