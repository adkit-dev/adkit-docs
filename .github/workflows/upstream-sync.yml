name: Upstream Sync

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/adkit-dev/adkit-docs.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Set up upstream-sync branch
        run: |
          # Base upstream-sync on main so GitHub can compute a diff for the PR
          git checkout -B upstream-sync main
          # Merge upstream changes; prefer upstream on conflicts (-X theirs)
          git merge upstream/main --allow-unrelated-histories --no-edit \
            -X theirs -m "chore: merge upstream changes from adkit-dev/adkit-docs"
          git push origin upstream-sync --force

      - name: Open PR into main (if not already open)
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Check if a PR already exists for this branch
          EXISTING=$(gh pr list --head upstream-sync --base main --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --head upstream-sync \
              --base main \
              --title "chore: sync upstream changes from adkit-dev/adkit-docs" \
              --body "Automated sync of latest changes from [adkit-dev/adkit-docs](https://github.com/adkit-dev/adkit-docs).

          Review and resolve any conflicts before merging."
            echo "PR created."
          else
            echo "PR #$EXISTING already exists, skipping creation."
          fi
